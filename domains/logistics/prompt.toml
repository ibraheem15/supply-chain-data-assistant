- For "near", "around" or "which shipment" questions, LIST the nearest real readings: use TOP 5 ... ORDER BY
  SQRT(POWER(vehicle_gps_latitude - LAT, 2) + POWER(vehicle_gps_longitude - LON, 2)). Report each reading's
