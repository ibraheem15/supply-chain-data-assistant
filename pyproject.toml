[project]
name = "supply-chain-fde"
version = "0.1.0"
description = "Agentic AI chat interface over a legacy SQL Server supply-chain dataset."
requires-python = ">=3.11"
dependencies = [
    "pyodbc>=5,<6",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
