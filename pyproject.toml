[project]
name = "supply-chain-fde"
version = "0.1.0"
description = "Agentic AI chat interface over a legacy SQL Server supply-chain dataset."
requires-python = ">=3.11"
dependencies = [
    "pyodbc>=5,<6",
    "langchain-core>=1,<2",
    "langchain-text-splitters>=1,<2",
    "langchain-pinecone>=0.2",
    "langchain-huggingface>=1,<2",
    "langchain-google-genai>=4,<5",
    "sentence-transformers>=3",
    "torch>=2.5,<3",
    "pypdf>=5",
    "openpyxl>=3.1,<4",
    "httpx>=0.28.1",
    "sqlglot>=30.21.0",
    "mcp>=1.9,<2",
    "langgraph>=1.0",
    "langchain-mcp-adapters>=0.2",
    "langchain-groq>=1.1.3",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs the local SQL Server and/or Pinecone"]
addopts = "-m 'not integration'"
